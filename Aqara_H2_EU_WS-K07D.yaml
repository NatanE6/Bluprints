blueprint:
  name: Aqara H2 EU WS-K07D
  description: >-
    Aqara H2 EU WS-K07D (Zigbee2MQTT). Per każdy przycisk wybierasz tryb:
    Toggle / CCT Color / RGB Color / Brightness Cycle / Custom / Wyłączony.
    Tryby CCT, RGB i Brightness automatycznie obsługują wzorzec "was-on restore":
    jeśli światło było wyłączone, zostaje włączone na 1 s (żeby ustawić kolor/jasność),
    a następnie wraca do stanu wyłączonego.
  domain: automation
  source_url: https://github.com/NatanE6/Bluprints/blob/main/Aqara_H2_EU_WS-K07D.yaml
  input:
    mqtt_action_topic:
      name: Topic MQTT – action
      description: "Np. zigbee2mqtt/TWOJE_URZADZENIE/action"
      default: zigbee2mqtt/YOUR_DEVICE/action
      selector:
        text: {}

    # ── GÓRA – single ──────────────────────────────────────────
    section_top_single:
      name: "GÓRA – single (single_up)"
      icon: mdi:arrow-up-bold
      collapsed: true
      input:
        top_single_mode:
          name: Tryb
          default: disabled
          selector:
            select:
              mode: list
              options:
                - label: "Wyłączony (nic)"
                  value: disabled
                - label: "Toggle (włącz / wyłącz)"
                  value: toggle
                - label: "CCT Color (temperatura barwowa)"
                  value: cct
                - label: "RGB Color (kolor)"
                  value: rgb
                - label: "Brightness Cycle (cykl jasności)"
                  value: brightness_cycle
                - label: "Custom action (dowolna akcja)"
                  value: custom
        top_single_lights:
          name: Światła
          description: "Tryby: Toggle / CCT / RGB / Brightness Cycle"
          default: []
          selector:
            entity:
              domain: light
              multiple: true

    section_top_single_cct:
      name: "GÓRA single – ustawienia CCT"
      icon: mdi:thermometer
      description: "Otwórz gdy tryb = CCT Color"
      collapsed: true
      input:
        top_single_cct_preset:
          name: Preset barwy
          default: warm
          selector:
            select:
              mode: list
              options:
                - label: "Ciepły (najcieplejszy dostępny przez żarówkę)"
                  value: warm
                - label: "Dzienny (4000 K)"
                  value: neutral
                - label: "Zimny (5800 K)"
                  value: cool
                - label: "Własny (wpisz Kelwiny poniżej)"
                  value: custom
        top_single_cct_kelvin:
          name: "Kelwiny (tylko przy preście: Własny)"
          default: 2700
          selector:
            number:
              min: 2000
              max: 6500
              step: 100
              unit_of_measurement: K
              mode: slider

    section_top_single_rgb:
      name: "GÓRA single – ustawienia RGB"
      icon: mdi:palette
      description: "Otwórz gdy tryb = RGB Color"
      collapsed: true
      input:
        top_single_rgb:
          name: Kolor RGB
          default: [255, 255, 255]
          selector:
            color_rgb: {}

    section_top_single_custom:
      name: "GÓRA single – akcja Custom"
      icon: mdi:lightning-bolt
      description: "Otwórz gdy tryb = Custom action"
      collapsed: true
      input:
        top_single_custom:
          name: Akcja
          default: []
          selector:
            action: {}

    # ── DÓŁ – single ──────────────────────────────────────────
    section_bottom_single:
      name: "DÓŁ – single (single_down)"
      icon: mdi:arrow-down-bold
      collapsed: true
      input:
        bottom_single_mode:
          name: Tryb
          default: disabled
          selector:
            select:
              mode: list
              options:
                - label: "Wyłączony (nic)"
                  value: disabled
                - label: "Toggle (włącz / wyłącz)"
                  value: toggle
                - label: "CCT Color (temperatura barwowa)"
                  value: cct
                - label: "RGB Color (kolor)"
                  value: rgb
                - label: "Brightness Cycle (cykl jasności)"
                  value: brightness_cycle
                - label: "Custom action (dowolna akcja)"
                  value: custom
        bottom_single_lights:
          name: Światła
          description: "Tryby: Toggle / CCT / RGB / Brightness Cycle"
          default: []
          selector:
            entity:
              domain: light
              multiple: true

    section_bottom_single_cct:
      name: "DÓŁ single – ustawienia CCT"
