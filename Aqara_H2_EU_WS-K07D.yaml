blueprint:
  name: Aqara H2 EU WS-K07D – minimal (single up/down, double down, hold down)
  description: >
    Mapuje wybrane akcje z Aqara H2 EU WS-K07D w Zigbee2MQTT.
    Obsługa: single_up, single_down, double_down, hold_down.
    Działa z topic'iem /action (czysty string) lub z JSON posiadającym pole "action".

  domain: automation

  input:
    mqtt_action_topic:
      name: Topic MQTT – action
      description: Np. zigbee2mqtt/TWOJE_URZADZENIE/action (lub topic bazowy, jeśli akcje lecą w JSON).
      default: zigbee2mqtt/YOUR_DEVICE/action
      selector: { text: {} }

    on_top_single:
      name: GÓRA – single (single_up)
      default: []
      selector: { action: {} }

    on_bottom_single:
      name: DÓŁ – single (single_down)
      default: []
      selector: { action: {} }

    on_bottom_double:
      name: DÓŁ – double (double_down)
      default: []
      selector: { action: {} }

    on_bottom_hold:
      name: DÓŁ – hold (hold_down)
      default: []
      selector: { action: {} }

mode: restart
max_exceeded: silent

trigger:
  - platform: mqtt
    topic: !input mqtt_action_topic

variables:
  # Obsługa dwóch wariantów: czysty string na /action lub JSON z polem "action" na topicu bazowym
  action: >-
    {% set pj = trigger.payload_json if trigger.payload_json is defined else {} %}
    {% if pj is mapping and 'action' in pj %}
      {{ (pj.action | string) | lower }}
    {% else %}
      {{ (trigger.payload | default('') | string) | lower }}
    {% endif %}

condition: []

action:
  - choose:
      - conditions: "{{ action == 'single_up' }}"
        sequence: !input on_top_single

      - conditions: "{{ action == 'single_down' }}"
        sequence: !input on_bottom_single

      - conditions: "{{ action == 'double_down' }}"
        sequence: !input on_bottom_double

      - conditions: "{{ action == 'hold_down' }}"
        sequence: !input on_bottom_hold
    default: []
