                        {% if p < 30 %}60{% elif p < 80 %}100{% else %}20{% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_hold_lights
                    data:
                      brightness_pct: "{{ _next_pct | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'custom' }}"
                sequence: !input bottom_hold_custom
            default: []
    default: []
