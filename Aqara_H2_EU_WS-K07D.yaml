mode: restart
max_exceeded: silent

trigger:
  - platform: mqtt
    topic: !input mqtt_action_topic

variables:
  action: >-
    {% set pj = trigger.payload_json if trigger.payload_json is defined else {} %}
    {% if pj is mapping and 'action' in pj %}
      {{ (pj.action | string) | lower }}
    {% else %}
      {{ (trigger.payload | default('') | string) | lower }}
    {% endif %}

condition: []

action:
  - choose:
      - conditions: "{{ action == 'single_up' }}"
        sequence:
          - variables:
              _mode: !input top_single_mode
              _lights: !input top_single_lights
              _cct_preset: !input top_single_cct_preset
              _cct_k_in: !input top_single_cct_kelvin
          - choose:
              - conditions: "{{ _mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input top_single_lights
              - conditions: "{{ _mode == 'cct' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                      _cct_k: >-
                        {% if _cct_preset == 'warm' %}
                          {% set max_m = expand(_lights)
                             | map(attribute='attributes.max_mireds')
                             | select('number') | list %}
                          {{ (1000000 / (max_m | max if max_m | length > 0 else 500)) | int }}
                        {% elif _cct_preset == 'neutral' %}
                          4000
                        {% elif _cct_preset == 'cool' %}
                          5800
                        {% else %}
                          {{ _cct_k_in | int(2700) }}
                        {% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input top_single_lights
                    data:
                      color_temp_kelvin: "{{ _cct_k | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'rgb' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                  - action: light.turn_on
                    target:
                      entity_id: !input top_single_lights
                    data:
                      rgb_color: !input top_single_rgb
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'brightness_cycle' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                      _next_pct: >-
                        {% set on_lights = expand(_lights) | selectattr('state','eq','on') | list %}
                        {% set bri = on_lights[0].attributes.brightness | int
                           if (on_lights and on_lights[0].attributes.brightness is not none)
                           else 0 %}
                        {% set p = bri * 100 // 255 %}
                        {% if p < 30 %}60{% elif p < 80 %}100{% else %}20{% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input top_single_lights
                    data:
                      brightness_pct: "{{ _next_pct | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'custom' }}"
                sequence: !input top_single_custom
            default: []

      - conditions: "{{ action == 'single_down' }}"
        sequence:
          - variables:
              _mode: !input bottom_single_mode
              _lights: !input bottom_single_lights
              _cct_preset: !input bottom_single_cct_preset
              _cct_k_in: !input bottom_single_cct_kelvin
          - choose:
              - conditions: "{{ _mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input bottom_single_lights
              - conditions: "{{ _mode == 'cct' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                      _cct_k: >-
                        {% if _cct_preset == 'warm' %}
                          {% set max_m = expand(_lights)
                             | map(attribute='attributes.max_mireds')
                             | select('number') | list %}
                          {{ (1000000 / (max_m | max if max_m | length > 0 else 500)) | int }}
                        {% elif _cct_preset == 'neutral' %}
                          4000
                        {% elif _cct_preset == 'cool' %}
                          5800
                        {% else %}
                          {{ _cct_k_in | int(2700) }}
                        {% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_single_lights
                    data:
                      color_temp_kelvin: "{{ _cct_k | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'rgb' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_single_lights
                    data:
                      rgb_color: !input bottom_single_rgb
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'brightness_cycle' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                      _next_pct: >-
                        {% set on_lights = expand(_lights) | selectattr('state','eq','on') | list %}
                        {% set bri = on_lights[0].attributes.brightness | int
                           if (on_lights and on_lights[0].attributes.brightness is not none)
                           else 0 %}
                        {% set p = bri * 100 // 255 %}
                        {% if p < 30 %}60{% elif p < 80 %}100{% else %}20{% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_single_lights
                    data:
                      brightness_pct: "{{ _next_pct | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'custom' }}"
                sequence: !input bottom_single_custom
            default: []

      - conditions: "{{ action == 'double_down' }}"
        sequence:
          - variables:
              _mode: !input bottom_double_mode
              _lights: !input bottom_double_lights
              _cct_preset: !input bottom_double_cct_preset
              _cct_k_in: !input bottom_double_cct_kelvin
          - choose:
              - conditions: "{{ _mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input bottom_double_lights
              - conditions: "{{ _mode == 'cct' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                      _cct_k: >-
                        {% if _cct_preset == 'warm' %}
                          {% set max_m = expand(_lights)
                             | map(attribute='attributes.max_mireds')
                             | select('number') | list %}
                          {{ (1000000 / (max_m | max if max_m | length > 0 else 500)) | int }}
                        {% elif _cct_preset == 'neutral' %}
                          4000
                        {% elif _cct_preset == 'cool' %}
                          5800
                        {% else %}
                          {{ _cct_k_in | int(2700) }}
                        {% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_double_lights
                    data:
                      color_temp_kelvin: "{{ _cct_k | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'rgb' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_double_lights
                    data:
                      rgb_color: !input bottom_double_rgb
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'brightness_cycle' }}"
                sequence:
                  - variables:
                      _was_off: >-
                        {{ expand(_lights) | selectattr('state','eq','off')
                           | map(attribute='entity_id') | list }}
                      _next_pct: >-
                        {% set on_lights = expand(_lights) | selectattr('state','eq','on') | list %}
                        {% set bri = on_lights[0].attributes.brightness | int
                           if (on_lights and on_lights[0].attributes.brightness is not none)
                           else 0 %}
                        {% set p = bri * 100 // 255 %}
                        {% if p < 30 %}60{% elif p < 80 %}100{% else %}20{% endif %}
                  - action: light.turn_on
                    target:
                      entity_id: !input bottom_double_lights
                    data:
                      brightness_pct: "{{ _next_pct | int }}"
                  - delay: "00:00:01"
                  - if:
                      - condition: template
                        value_template: "{{ _was_off | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ _was_off }}"
              - conditions: "{{ _mode == 'custom' }}"
                sequence: !input bottom_double_custom
            default: []

      - conditions: "{{ action == 'hold_down' }}"
        sequence:
          - variables:
              _mode: !input bottom_hold_mode
              _lights: !input bottom_hold_lights
              _cct_preset: !input bottom_hold_cct_preset
              _cct_k_in: !input bottom_hold_cct_kelvin
          - choose:
              - conditions: "{{ _mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input bottom_hold_lights
              - conditions: "{{ _mode == 'cct' }}"
